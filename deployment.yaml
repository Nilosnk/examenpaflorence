apiVersion: apps/v1
kind: Deployment
metadata:
  name: examenpaflorence
spec:
  replicas: 1
  selector:
    matchLabels:
      app: examenpaflorence
  template:
    metadata:
      labels:
        app: examenpaflorence
    spec:
      containers:
      - name: examenpaflorence
        image: TU_USUARIO_DOCKERHUB/examenpaflorence:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: examenpaflorence-service
spec:
  type: NodePort
  selector:
    app: examenpaflorence
  ports:
  - port: 80
    targetPort: 80
